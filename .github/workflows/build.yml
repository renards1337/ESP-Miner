name: Build Firmware
on: [push, pull_request]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.14.0'
    - name: Build web dist
      working-directory: ./main/http_server/axe-os
      run: |
        npm ci
        npm run build
    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.0.3
        target: esp32s3
        command: GITHUB_ACTIONS="true" idf.py build
        path: '.'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    - run: pip install esptool
    - name: Run merge script
      run: |
        chmod +x merge_bin.sh
        ./merge_bin.sh || true
    - name: Manual Fallback Merge (if script fails)
      run: |
        if [ ! -f ./esp-miner-merged.bin ]; then
          python -m esptool --chip esp32s3 merge_bin -o esp-miner-merged.bin --flash_mode dio --flash_size 16MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/esp-miner.bin
        fi
    - name: upload esp-miner-merged.bin
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner-factory.bin
        path: ./esp-miner-merged.bin
    - name: upload esp-miner.bin
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner.bin
        path: ./build/esp-miner.bin
