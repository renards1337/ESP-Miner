@if (form) {
  <form [formGroup]="form">
    <div class="card">
      <div class="flex flex-col md:flex-row md:items-center mb-4 gap-2">
        <label for="ssid" class="w-full md:w-2/12 font-medium">Wi-Fi Tīkls (SSID)</label>
        <div class="w-full md:w-10/12 flex gap-2 items-center">
          <input class="input-text flex-grow" id="ssid" type="text" formControlName="ssid" placeholder="Izvēlies vai ieraksti Wi-Fi" />
          <button
            type="button"
            class="btn btn-secondary px-3.5 py-2.5 cursor-pointer"
            (click)="scanWifi()"
            [disabled]="scanning"
            appTooltip="Meklēt Wi-Fi"
            tooltipPosition="left">
            <i class="pi {{scanning ? 'pi-spinner pi-spin' : 'pi-search'}}"></i>
          </button>
        </div>
      </div>

      <div class="flex flex-col md:flex-row md:items-center mb-4 gap-2">
        <label for="wifiPass" class="w-full md:w-2/12 font-medium">Wi-Fi Parole</label>
        <div class="w-full md:w-10/12">
          <div class="relative w-full">
            <input class="input-text pr-10" id="wifiPass" formControlName="wifiPass"
              [type]="showWifiPassword ? 'text' : 'password'"
              placeholder="Ievadi Wi-Fi paroli" />
            @if (form.get('wifiPass')?.dirty) {
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer text-secondary hover:text-main"
                (click)="toggleWifiPasswordVisibility()">
                <i class="pi {{!showWifiPassword ? 'pi-eye' : 'pi-eye-slash'}}"></i>
              </span>
            }
          </div>
        </div>
      </div>

      <!-- BITCOIN ADRESES LAUKS (Pievienots automātiskajam ckpool) -->
      <div class="flex flex-col md:flex-row md:items-center mb-4 gap-2" *ngIf="form.contains('pools') || true">
        <label for="btcAddress" class="w-full md:w-2/12 font-medium">Bitcoin Adrese</label>
        <div class="w-full md:w-10/12">
          <input class="input-text" id="btcAddress" type="text" formControlName="stratumUser" placeholder="Ievadi savu Bitcoin adrese (bc1...)" />
          <small class="text-gray-500 block mt-1">Serveris (solo.ckpool.org:3333) iestatīsies automātiski fonā.</small>
        </div>
      </div>

      <div class="flex mt-5 gap-3">
        <button [disabled]="!form.dirty || form.invalid" (click)="updateSystem()"
        class="btn">Saglabāt un Pieslēgties</button>
        <button [disabled]="!savedChanges" (click)="restart()" class="btn" [class.btn-secondary]="!savedChanges">Restartēt</button>
      </div>
    </div>
  </form>
}
